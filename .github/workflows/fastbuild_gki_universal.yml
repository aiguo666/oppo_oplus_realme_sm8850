name: (通用GKI) 多版本 GKI 内核构建 · AnyKernel3

# ============================================================================
# 这份 workflow 的核心思路
#   只编译 arch/arm64/boot/Image，然后用 AnyKernel3 把它塞回设备"原厂 boot.img"。
#   ramdisk / cmdline / dtb / vendor_boot / vbmeta 全部复用设备原值，
#   所以能不能开机只取决于三件事：
#     1) vermagic 版本串与设备原厂一致（kernel_vermagic）
#     2) KMI 符号 CRC 一致（同分支源码 + 同版本 clang + 路径重映射）
#     3) 页大小一致（本项目统一 4K，版本串结尾的 -4k 就是它）
#
#   版本档位表（源码 - 分支 - 工具链）：
#     6.12.69-android16-2026-03  cctv18/android_gki_kernel_common  android16-6.12-2026-03  Clang19-r536225  ✔ 已验证
#     6.12-android16-2025-06     cctv18/android_gki_kernel_common  android16-6.12-2025-06  Clang19-r536225
#     6.6-android15              aosp-mirror/kernel_common         android15-6.6           Clang18-r510928
#     6.1-android14-lts          cctv18/android_gki_kernel_common  android14-6.1-lts       Clang18-r510928
#     5.15-android13             aosp-mirror/kernel_common         android13-5.15          Clang18-r510928  实验性
#     5.10-android12             aosp-mirror/kernel_common         android12-5.10          Clang18-r510928  实验性
#     custom                     自定义 owner/repo + 分支 + 工具链
#
#   注意：Clang18 那个 release 里没有 rust.zip，所以只有 6.12 档位会下载 Rust 工具链。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      gki_target:
        description: '要编译的 GKI 版本档位(必须与你机型原厂 KMI 完全一致才能开机; custom 见下方四个自定义项)'
        required: true
        type: choice
        default: '6.12.69-android16-2026-03'
        options:
          - '6.12.69-android16-2026-03'
          - '6.12-android16-2025-06'
          - '6.6-android15'
          - '6.1-android14-lts'
          - '5.15-android13'
          - '5.10-android12'
          - 'custom'
      custom_source:
        description: '仅 custom 档位：源码仓库 owner/repo（例如 aosp-mirror/kernel_common）'
        required: false
        type: string
        default: ''
      custom_branch:
        description: '仅 custom 档位：分支名（例如 android15-6.6；android 版本与内核版本会从分支名解析）'
        required: false
        type: string
        default: ''
      custom_clang_tag:
        description: '仅 custom 档位：工具链 release tag（例如 LLVM-Clang18-r510928）'
        required: false
        type: string
        default: ''
      custom_clang_zip:
        description: '仅 custom 档位：clang 压缩包名（例如 clang-r510928.zip）'
        required: false
        type: string
        default: ''
      kernel_vermagic:
        description: '内核版本串(vermagic 后缀)，形如 android16-5-ga8f88ad96df3-ab13929693-4k；留空时 6.12.69 档位自动用实测值，其余档位保留源码默认串'
        required: false
        type: string
        default: ''
      ak3_repo:
        description: 'AnyKernel3 仓库地址(默认 cctv18 的，只支持欧加真 sm8850 机型；换机型请换成自己改过 anykernel.sh 白名单的仓库)'
        required: false
        type: string
        default: 'https://github.com/cctv18/AnyKernel3'
      ksu_type:
        description: 'KernelSU分支(BakaSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认BakaSU)'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - 'bakasu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启susfs(增强隐藏环境挂载; 若该版本 susfs 补丁打不上会自动跳过并警告)'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '是否内置 KPM(KPatch-Next)。危险提醒: 6.6.118 实测可开机, 6.12 系列 KPatch-Next 适配尚不完整, 可能打补丁失败或开机卡死。脚本不会拒绝编译, 但刷机前务必备份 boot 分区, 风险自负'
        required: true
        type: boolean
        default: 'false'
      vp_hide:
        description: '是否把 /proc/<pid>/maps 隐藏编译进内核(隐藏 ZygiskNext 注入段; 目前只有 6.6 / 6.12 有补丁, 其他版本自动跳过)'
        required: true
        type: boolean
        default: 'true'
      unicode_fix:
        description: '是否应用零宽字符修复(lemonsn unicode_bypass_fix)。已在 6.1 / 6.6 / 6.12 的 fs/unicode 源码上验证可干净应用'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁(老版本内核可能部分 hunk 打不上)'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项) 仅 6.12 档位可用'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(ipset 及 iptables 高级网络功能)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能; 源码无该调度器时自动忽略)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力; 源码无该特性时自动忽略)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '文件名后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      source_repo: ${{ steps.profile.outputs.source_repo }}
      source_branch: ${{ steps.profile.outputs.source_branch }}
      android_version: ${{ steps.profile.outputs.android_version }}
      kernel_version: ${{ steps.profile.outputs.kernel_version }}
      sub_version: ${{ steps.profile.outputs.sub_version }}
      ccache_key: ${{ steps.profile.outputs.ccache_key }}
      clang_tag: ${{ steps.profile.outputs.clang_tag }}
      clang_zip: ${{ steps.profile.outputs.clang_zip }}
      need_rust: ${{ steps.profile.outputs.need_rust }}
      vp_patch: ${{ steps.profile.outputs.vp_patch }}
      default_vermagic: ${{ steps.profile.outputs.default_vermagic }}
    steps:
      - name: 解析内核版本档位
        id: profile
        run: |
          set -euo pipefail
          TARGET="${{ inputs.gki_target }}"
          NEED_RUST=false
          VP_PATCH=""
          DEFAULT_VERMAGIC=""

          case "$TARGET" in
            6.12.69-android16-2026-03)
              REPO="cctv18/android_gki_kernel_common"; BRANCH="android16-6.12-2026-03"
              ANDROID="android16"; KVER="6.12"; SUB="69_gki"
              CLANG_TAG="LLVM-Clang19-r536225"; CLANG_ZIP="clang-r536225.zip"; NEED_RUST=true
              VP_PATCH="0001-proc-vp-hide-6.12.patch"
              DEFAULT_VERMAGIC="android16-5-ga8f88ad96df3-ab13929693-4k"
              ;;
            6.12-android16-2025-06)
              REPO="cctv18/android_gki_kernel_common"; BRANCH="android16-6.12-2025-06"
              ANDROID="android16"; KVER="6.12"; SUB="2025_06"
              CLANG_TAG="LLVM-Clang19-r536225"; CLANG_ZIP="clang-r536225.zip"; NEED_RUST=true
              VP_PATCH="0001-proc-vp-hide-6.12.patch"
              ;;
            6.6-android15)
              REPO="aosp-mirror/kernel_common"; BRANCH="android15-6.6"
              ANDROID="android15"; KVER="6.6"; SUB="gki"
              CLANG_TAG="LLVM-Clang18-r510928"; CLANG_ZIP="clang-r510928.zip"
              VP_PATCH="0001-proc-vp-hide.patch"
              ;;
            6.1-android14-lts)
              REPO="cctv18/android_gki_kernel_common"; BRANCH="android14-6.1-lts"
              ANDROID="android14"; KVER="6.1"; SUB="lts"
              CLANG_TAG="LLVM-Clang18-r510928"; CLANG_ZIP="clang-r510928.zip"
              ;;
            5.15-android13)
              REPO="aosp-mirror/kernel_common"; BRANCH="android13-5.15"
              ANDROID="android13"; KVER="5.15"; SUB="gki"
              CLANG_TAG="LLVM-Clang18-r510928"; CLANG_ZIP="clang-r510928.zip"
              ;;
            5.10-android12)
              REPO="aosp-mirror/kernel_common"; BRANCH="android12-5.10"
              ANDROID="android12"; KVER="5.10"; SUB="gki"
              CLANG_TAG="LLVM-Clang18-r510928"; CLANG_ZIP="clang-r510928.zip"
              ;;
            custom)
              REPO="${{ inputs.custom_source }}"
              BRANCH="${{ inputs.custom_branch }}"
              CLANG_TAG="${{ inputs.custom_clang_tag }}"
              CLANG_ZIP="${{ inputs.custom_clang_zip }}"
              if [ -z "$REPO" ] || [ -z "$BRANCH" ] || [ -z "$CLANG_TAG" ] || [ -z "$CLANG_ZIP" ]; then
                echo "::error::custom 档位必须同时填写 custom_source / custom_branch / custom_clang_tag / custom_clang_zip"
                exit 1
              fi
              ANDROID=$(echo "$BRANCH" | grep -oE 'android[0-9]+' | head -n1 || true)
              KVER=$(echo "$BRANCH" | grep -oE '[0-9]+\.[0-9]+' | head -n1 || true)
              SUB=$(echo "$BRANCH" | grep -oE '(gki|lts|20[0-9]{2}-[0-9]{2})' | head -n1 || true)
              [ -n "$ANDROID" ] || { echo "::error::无法从分支名 $BRANCH 解析 android 版本，请用 androidNN-x.y 形式的分支名"; exit 1; }
              [ -n "$KVER" ]    || { echo "::error::无法从分支名 $BRANCH 解析内核版本，请用 androidNN-x.y 形式的分支名"; exit 1; }
              [ -n "$SUB" ]     || SUB="gki"
              KMAJ=${KVER%%.*}; KMIN=${KVER##*.}
              if [ "$KMAJ" -gt 6 ] || { [ "$KMAJ" -eq 6 ] && [ "$KMIN" -ge 12 ]; }; then NEED_RUST=true; fi
              ;;
            *)
              echo "::error::未知档位 $TARGET"
              exit 1
              ;;
          esac

          # 只有 6.12 的 ACK 才需要 Rust（6.12 的 gki_defconfig 里已有 CONFIG_RUST=y）
          if [ "$NEED_RUST" = "true" ] && [ "$CLANG_TAG" != "LLVM-Clang19-r536225" ]; then
            echo "::warning::档位 $TARGET 需要 Rust，但工具链 $CLANG_TAG 的 release 里可能没有 rust.zip"
          fi

          # 6.12.69 档位沿用旧 workflow 的 key，可以直接复用已有的 Actions 缓存
          if [ "$TARGET" = "6.12.69-android16-2026-03" ]; then
            CCKEY="ccache-ecsv4-gki-6.12.69"
          else
            CCKEY="ccache-ecsv4-gki-${KVER}.${SUB}"
          fi

          {
            echo "source_repo=$REPO"
            echo "source_branch=$BRANCH"
            echo "android_version=$ANDROID"
            echo "kernel_version=$KVER"
            echo "sub_version=$SUB"
            echo "ccache_key=$CCKEY"
            echo "clang_tag=$CLANG_TAG"
            echo "clang_zip=$CLANG_ZIP"
            echo "need_rust=$NEED_RUST"
            echo "vp_patch=$VP_PATCH"
            echo "default_vermagic=$DEFAULT_VERMAGIC"
          } >> "$GITHUB_OUTPUT"

          echo "档位: $TARGET"
          echo "源码: $REPO @ $BRANCH"
          echo "内核: $KVER ($ANDROID), 子版本: $SUB"
          echo "工具链: $CLANG_TAG / $CLANG_ZIP, Rust: $NEED_RUST"
          echo "vp_hide 补丁: ${VP_PATCH:-无}"
          echo "默认版本串: ${DEFAULT_VERMAGIC:-无}"

  build:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
      kernel_rel: ${{ steps.build_kernel.outputs.kernel_rel }}
    permissions:
      actions: write
      contents: read
    env:
      SOURCE_REPO: ${{ needs.setup.outputs.source_repo }}
      SOURCE_BRANCH: ${{ needs.setup.outputs.source_branch }}
      ANDROID_VERSION: ${{ needs.setup.outputs.android_version }}
      KERNEL_VERSION: ${{ needs.setup.outputs.kernel_version }}
      SUB_VERSION: ${{ needs.setup.outputs.sub_version }}
      CCACHE_KEY: ${{ needs.setup.outputs.ccache_key }}
      CLANG_TAG: ${{ needs.setup.outputs.clang_tag }}
      CLANG_ZIP: ${{ needs.setup.outputs.clang_zip }}
      NEED_RUST: ${{ needs.setup.outputs.need_rust }}
      VP_PATCH: ${{ needs.setup.outputs.vp_patch }}
      VERMAGIC_INPUT: ${{ github.event.inputs.kernel_vermagic }}
      VERMAGIC_FALLBACK: ${{ needs.setup.outputs.default_vermagic }}
    steps:
      - name: 安装环境依赖 + 初始化源码仓库及工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          echo "编译档位：${{ inputs.gki_target }}"

          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev libdw-dev &

          # 使用最新版 ccache（Ubuntu 软件仓库的版本并非最新）
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&
          sudo cp -f ./ccache /usr/bin/ccache &&
          sudo chmod +x /usr/bin/ccache &&
          rm -f ./ccache &

          echo "正在下载内核源码：${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_BRANCH }}"
          SRC_DIR="${SOURCE_REPO##*/}-${SOURCE_BRANCH}"
          aria2c -s16 -x16 -k1M "https://github.com/${SOURCE_REPO}/archive/refs/heads/${SOURCE_BRANCH}.zip" -o common.zip &&
          unzip -q common.zip &&
          mv "$SRC_DIR" common &&
          rm -rf common.zip &

          echo "正在下载工具链：${{ env.CLANG_TAG }} / ${{ env.CLANG_ZIP }}" &&
          mkdir -p clang-tc &&
          aria2c -s16 -x16 -k1M "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${CLANG_TAG}/${CLANG_ZIP}" -o clang.zip &&
          unzip -q clang.zip -d clang-tc &&
          rm -rf clang.zip &

          # 只有 6.12 档位需要 Rust；Clang18 的 release 里没有 rust.zip
          if [ "$NEED_RUST" = "true" ]; then
            echo "正在下载 Rust 工具链..." &&
            mkdir -p rust &&
            aria2c -s16 -x16 -k1M "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${CLANG_TAG}/rust.zip" -o rust.zip &&
            unzip -q rust.zip -d rust &&
            rm -rf rust.zip &
          else
            echo "当前档位不需要 Rust 工具链，跳过"
          fi

          echo "正在下载构建工具..." &&
          aria2c -s16 -x16 -k1M "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${CLANG_TAG}/build-tools.zip" -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &

          wait
          echo "所有源码及工具链初始化完成！"

          # 去掉 dirty 后缀，保证 vermagic 稳定
          echo "正在去除 dirty 后缀..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

          echo "---- 源码目录检查 ----"
          [ -f common/arch/arm64/configs/gki_defconfig ] && echo "OK  gki_defconfig" || { echo "::error::源码里没有 arch/arm64/configs/gki_defconfig，档位不匹配"; exit 1; }
          [ -d clang-tc ] && ls clang-tc | head -3

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查本地缓存状态..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi

          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi

          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "公共 ccache 恢复完成！"
          else
            echo "公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译..."
          fi

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi

      - name: 初始化并配置ccache
        run: |
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"

          mkdir -p "$CCACHE_DIR"
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          ccache -s

          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU
        id: ksu_version
        run: |
          cd kernel_workspace
          if [[ ${{ inputs.ksu_type }} == "sukisu" || ${{ inputs.ksu_type }} == "bakasu" ]]; then
            echo "正在配置BakaSU..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ inputs.ksu_type }} == "ksunext" ]]; then
            echo "正在配置KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            cd ../common/drivers/kernelsu
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ ${{ inputs.ksu_type }} == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ ${{ inputs.ksu_type }} != "none" ]]; then
            echo "正在添加susfs补丁..."
            if git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}; then
              cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/ || true
              cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/ || true
              cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/ || true
              cd ./common
              patch -p1 -F 3 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
              cd ..
              if [ -f ./common/fs/susfs.c ]; then
                touch susfs.ok
                echo "SUSFS 补丁已落地"
              else
                rm -f susfs.ok
                echo "::warning::SUSFS 补丁未落地（该内核版本可能还没有对应补丁），后续会自动跳过 SUSFS 配置"
              fi
            else
              echo "::warning::克隆 susfs4oki 的 oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }} 分支失败，跳过 SUSFS"
            fi
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
          fi
          if [[ ${{ inputs.ksu_type }} == "ksu" ]]; then
            echo "正在为原版 KernelSU (tiann/KernelSU)添加补丁..."
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/ || true
            cd ./KernelSU
            patch -p1 -F 3 < 10_enable_susfs_for_ksu.patch || true
          fi

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
        run: |
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace
          git clone --depth=1 https://github.com/$GITHUB_REPOSITORY.git -b $GITHUB_REF_NAME $GITHUB_ACTOR
          cp ./$GITHUB_ACTOR/zram_patch/001-lz4.patch ./common/
          cp ./$GITHUB_ACTOR/zram_patch/002-zstd.patch ./common/
          cd ./common
          patch -p1 -F 3 < 001-lz4.patch || true
          patch -p1 -F 3 < 002-zstd.patch || true

      - name: 应用 lz4kd 补丁
        if: inputs.lz4kd_enable
        run: |
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/lz4kd.patch
          patch -p1 -F 3 < lz4kd.patch || true

      - name: 添加SUSFS 配置项
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [ ! -f susfs.ok ]; then
            echo "::warning::SUSFS 代码不在源码树里，跳过 CONFIG_KSU_SUSFS 系列配置（否则会链接失败）"
            exit 0
          fi
          echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 添加 KSU & 其他配置项
        run: |
          cd kernel_workspace
          # 无内置 KSU 时不写 CONFIG_KSU（否则 drivers/kernelsu 不存在会编不过）
          if [[ "${{ inputs.ksu_type }}" != "none" ]]; then
            echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ inputs.susfs_enable }}" == "false" ]] || [ ! -f susfs.ok ]; then
              echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi
          # 添加对 Mountify (backslashxx/mountify) 模块的支持
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ inputs.lz4kd_enable }}" == "true" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 开启O2编译优化配置
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          # 禁用 defconfig 检查（老版本没有 build.config.gki 时自动跳过）
          if [ -f ./common/build.config.gki ]; then sed -i 's/check_defconfig//' ./common/build.config.gki; fi
          # 跳过将 uapi 标准头安装到 usr/include 目录，节省编译时间
          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig
          # 6.12 的 Rust 配置（gki_defconfig 里本来就有 CONFIG_RUST=y，这里再确认一次）
          if [ "${{ env.NEED_RUST }}" = "true" ]; then
            echo "CONFIG_RUST=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ANDROID_BINDER_IPC_RUST=m" >> ./common/arch/arm64/configs/gki_defconfig
          fi

      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          cd kernel_workspace
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          # 部分机型的 vintf 检测会因为 CONFIG_IP6_NF_NAT 报"设备内部出现问题"，用补丁把该 config 从 /proc/config.gz 里隐藏
          cd common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/config.patch
          patch -p1 -F 3 < config.patch || true

      - name: 添加 BBR 等一系列拥塞控制算法
        run: |
          if [[ "${{ inputs.bbr_enable }}" != "false" ]]; then
            echo "正在添加BBR等拥塞控制算法..."
            cd kernel_workspace
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ inputs.bbr_enable }}" == "default" ]]; then
              echo "正在将BBR设为默认拥塞控制算法..."
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用 Droidspaces 容器支持
        run: |
          if [[ "${{ inputs.droidspaces_enable }}" != "false" ]]; then
            if [[ "${{ env.KERNEL_VERSION }}" != "6.12" ]]; then
              echo "::warning::Droidspaces 的补丁目前只适配 6.12，当前档位 ${{ env.KERNEL_VERSION }} 跳过"
              exit 0
            fi
            echo "正在启用 Droidspaces 容器支持..."
            cd kernel_workspace/common
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_a16-6.12.patch
            patch -p1 -F 3 < fix_sysvipc_kabi_a16-6.12.patch || true
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch || true
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ddl_hit_hook.patch || true
            patch -p1 -F 3 < ddl_hit_hook.patch || true
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig
            if [[ "${{ inputs.droidspaces_enable }}" == "extend" ]]; then
              echo "正在启用容器环境扩展支持..."
              echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> ./arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用ADIOS IO调度器
        if: inputs.adios_enable
        run: |
          cd kernel_workspace
          if ! grep -rq "MQ_IOSCHED_ADIOS" ./common/block/ 2>/dev/null; then
            echo "::warning::当前源码没有 ADIOS 调度器（该特性来自 cctv18 的 6.12 分支），跳过"
            exit 0
          fi
          echo "正在启用ADIOS IO调度器…"
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          cd kernel_workspace
          if ! grep -rq "REKERNEL" ./common/Kconfig ./common/init/ 2>/dev/null; then
            echo "::warning::当前源码没有 Re-Kernel 支持，跳过"
            exit 0
          fi
          echo "正在启用Re-Kernel支持…"
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_REKERNEL_NETWORK=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用内核级基带保护(BBG)
        if: inputs.baseband_guard
        run: |
          set +e
          cd kernel_workspace

          bbg_ok() { grep -rq "baseband_guard" ./common/security 2>/dev/null; }

          # 优先用 cctv18 的分支（6.12 已验证），失败再退回 vc-teahouse 上游
          if ! bbg_ok; then
            echo "尝试安装 cctv18/Baseband-guard ..."
            ( cd ./common && curl -fsSL --retry 2 https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash ) || true
          fi
          if ! bbg_ok; then
            echo "cctv18 版未生效，改用 vc-teahouse/Baseband-guard ..."
            ( cd ./common && curl -fsSL --retry 2 https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash ) || true
          fi

          # LSM 默认列表：两种锚点都试（selinux 是 6.6 及以下，lockdown 是较新主线）
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./common/security/Kconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' ./common/security/Kconfig

          if grep -rq "baseband_guard" ./common/security 2>/dev/null; then
            grep -q '^CONFIG_BBG=y' ./common/arch/arm64/configs/gki_defconfig || echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "BBG 已接入（security/Kconfig 已包含 baseband_guard）"
            echo "BBG_STATUS=ok" >> $GITHUB_ENV
          else
            echo "::warning::BBG 注入失败：security/ 下没有 baseband_guard。本次不写 CONFIG_BBG，内核照常编译（等于没开基带保护）"
            echo "BBG_STATUS=failed" >> $GITHUB_ENV
          fi
          exit 0

      - name: 内置 maps 隐藏(PROC_VP_HIDE)
        if: inputs.vp_hide
        run: |
          set -e
          cd kernel_workspace
          if [ -z "${{ env.VP_PATCH }}" ]; then
            echo "::warning::当前档位（${{ env.KERNEL_VERSION }}）还没有对应的 vp_hide 补丁，跳过。已有补丁：6.6 / 6.12"
            exit 0
          fi

          PATCH_URL="https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/${{ env.VP_PATCH }}"
          echo "正在下载补丁：$PATCH_URL"
          if ! curl -fsSL --retry 3 --connect-timeout 20 "$PATCH_URL" -o vp_hide.patch; then
            echo "::error::下载 ${{ env.VP_PATCH }} 失败，请确认它已放在仓库根目录（分支 $GITHUB_REF_NAME）"
            exit 1
          fi
          echo "补丁行数：$(wc -l < vp_hide.patch)"

          cd common
          if git apply -p1 --whitespace=nowarn ../vp_hide.patch; then
            echo "git apply 完成"
          else
            echo "git apply 未通过，改用 patch -p1 -F1（只允许 1 行模糊）"
            if ! patch -p1 -F1 --forward --no-backup-if-mismatch < ../vp_hide.patch; then
              echo "::warning::patch 返回非 0，继续做落点自检"
              find . -maxdepth 3 -name '*.rej' | head -5
            fi
          fi

          # Kconfig / Makefile 追加放在补丁外面：两者都在文件尾部，用 patch -F3 容易被塞错位置
          grep -q '^config PROC_VP_HIDE' fs/proc/Kconfig || printf '\nconfig PROC_VP_HIDE\n\tbool "Hide a VMA window from maps/smaps/numa_maps"\n\tdepends on PROC_FS && MMU\n\tdefault y\n' >> fs/proc/Kconfig
          grep -q 'vp_hide.o' fs/proc/Makefile || echo 'proc-$(CONFIG_PROC_VP_HIDE) += vp_hide.o' >> fs/proc/Makefile
          grep -q '^CONFIG_PROC_VP_HIDE' arch/arm64/configs/gki_defconfig || echo 'CONFIG_PROC_VP_HIDE=y' >> arch/arm64/configs/gki_defconfig

          echo "---- 落点自检 ----"
          MISS=0
          chk() {
            if grep -q "$2" "$1"; then
              echo "OK   $1  <<  $2"
            else
              echo "::error::$1 缺少 $2"
              MISS=$((MISS + 1))
            fi
          }
          chk fs/proc/vp_hide.c      'static bool vp_decide'
          chk fs/proc/vp_hide.h      'struct vp_hide_state'
          chk fs/proc/internal.h     'struct vp_hide_state vp;'
          if [[ "${{ env.KERNEL_VERSION }}" == "6.12" ]]; then
            chk fs/proc/task_mmu.c   'static int vp_show_map'
            chk fs/proc/task_mmu.c   'static int vp_show_smap'
            chk fs/proc/task_mmu.c   'static int vp_show_numa_map'
            chk fs/proc/task_mmu.c   'vp_rollup_skip(&mss->vp, vma, start)'
            chk fs/proc/task_mmu.c   'show[[:space:]]*= vp_show_map'
            chk fs/proc/task_mmu.c   'show[[:space:]]*= vp_show_smap'
            chk fs/proc/task_mmu.c   'show[[:space:]]*= vp_show_numa_map'
          else
            chk fs/proc/task_mmu.c   'vp_should_hide(m, vma)'
            chk fs/proc/task_mmu.c   'vp_rollup_skip(&mss->vp, vma, start)'
            chk fs/proc/task_mmu.c   'vp_should_hide_priv(&numa_priv->proc_maps, vma)'
          fi
          chk fs/proc/Kconfig        '^config PROC_VP_HIDE'
          chk fs/proc/Makefile       'vp_hide.o'
          chk arch/arm64/configs/gki_defconfig '^CONFIG_PROC_VP_HIDE=y'
          [ "$MISS" -eq 0 ] || { echo "::error::有 $MISS 处落点没对上，别继续编"; exit 1; }

          echo "maps 隐藏已内置完成"

      - name: 应用零宽字符修复(unicode_bypass_fix)
        if: inputs.unicode_fix
        run: |
          set +e
          cd kernel_workspace/common
          URL="https://raw.githubusercontent.com/lemonsn/kernel/refs/heads/main/unicode_bypass_fix_6.1.patch"
          echo "正在下载 $URL"
          if ! curl -fsSL --retry 3 --connect-timeout 20 "$URL" -o ../unicode.patch; then
            echo "::warning::零宽补丁下载失败，跳过（不影响编译）"
            exit 0
          fi

          echo "---- 打补丁 ----"
          if patch -p1 --forward --no-backup-if-mismatch -F3 < ../unicode.patch; then
            echo "补丁应用完成"
          else
            echo "::warning::patch 返回非 0（可能部分 hunk 已应用），继续做效果自检"
          fi

          echo "---- 效果自检 ----"
          FAIL=0
          if grep -q "ignore_init" fs/unicode/mkutf8data.c; then
            echo "::warning::mkutf8data.c 里 ignore_init 仍存在，生成器侧未改到"
            FAIL=$((FAIL + 1))
          else
            echo "OK   mkutf8data.c 已移除 ignore_init"
          fi
          if grep -q "utf8data\[64080\]" fs/unicode/utf8data.c_shipped; then
            echo "OK   utf8data.c_shipped 已替换为 64080 字节表"
          else
            echo "::warning::utf8data.c_shipped 仍是旧表(64256)，运行时行为不会改变"
            FAIL=$((FAIL + 1))
          fi
          grep -q '^CONFIG_UNICODE=y' arch/arm64/configs/gki_defconfig \
            && echo "OK   CONFIG_UNICODE=y" \
            || echo "::warning::defconfig 未开启 CONFIG_UNICODE，这个补丁不会生效"

          if [ "$FAIL" -eq 0 ]; then
            echo "UNICODE_FIX_STATUS=ok" >> $GITHUB_ENV
          else
            echo "UNICODE_FIX_STATUS=partial" >> $GITHUB_ENV
            echo "::warning::零宽补丁只应用了一部分，请把上面两条 warning 记下来"
          fi
          exit 0

      - name: 添加制作名称(vermagic)
        run: |
          cd kernel_workspace
          # 手填优先；没填就用档位的默认版本串（6.12.69 档位有实测值，其他档位为空）
          NAME="${VERMAGIC_INPUT:-$VERMAGIC_FALLBACK}"
          DEFCFG=./common/arch/arm64/configs/gki_defconfig

          if [ -n "$NAME" ]; then
            echo "目标版本串：$NAME"
            echo "EXPECT_VERMAGIC=$NAME" >> $GITHUB_ENV
            # setlocalversion 固定输出（AUTO 关闭时仍会被调用）
            sed -i "\$s|echo \"\$res\"|echo \"-$NAME\"|" ./common/scripts/setlocalversion
            sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
            # 6.6 / 6.12 的 gki_defconfig 里有 CONFIG_LOCALVERSION="-4k"；6.1 没有，需要追加
            if grep -q '^CONFIG_LOCALVERSION="-4k"' "$DEFCFG"; then
              sed -i "s|^CONFIG_LOCALVERSION=\"-4k\"|CONFIG_LOCALVERSION=\"-$NAME\"|" "$DEFCFG"
            else
              sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCFG"
              echo "CONFIG_LOCALVERSION=\"-$NAME\"" >> "$DEFCFG"
            fi
          else
            echo "::warning::未填写 kernel_vermagic，且当前档位没有默认值，将保留源码默认版本串。若与设备原厂不一致，厂商模块会因 vermagic/CRC 不符而加载失败（表现为卡开机动画）"
          fi

          grep -q '^CONFIG_LOCALVERSION_AUTO=n' "$DEFCFG" || echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCFG"
          echo "---- defconfig 里的版本串 ----"
          grep -n '^CONFIG_LOCALVERSION' "$DEFCFG" || true

      - name: 构建内核
        id: build_kernel
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang-tc/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          if [ -d "$WORKDIR/kernel_workspace/rust/bin" ]; then export PATH="$WORKDIR/kernel_workspace/rust/bin:$PATH"; fi
          export CLANG_DIR="$WORKDIR/kernel_workspace/clang-tc/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          echo "编译器信息: $CLANG_VERSION / $LLD_VERSION"
          if [ "${{ env.NEED_RUST }}" = "true" ]; then
            echo "Rustc: $(rustc -V 2>/dev/null | head -n1)  Bindgen: $(bindgen --version 2>/dev/null | head -n1)"
          fi
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole：未安装" || echo "pahole：$pahole_version"

          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"

          cd kernel_workspace/common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so
          chmod 777 ./*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          export REAL_CLANG_PATH="$WORKDIR/kernel_workspace/clang-tc/bin/clang"

          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache $REAL_CLANG_PATH "$@"' >> cc-wrapper

          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper

          chmod +x cc-wrapper ld-wrapper
          echo "--- 编译前环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"

          # 1. 路径重映射：6.12 用 gendwarfksyms 从 DWARF 算符号 CRC，它无法正确预处理绝对路径，
          #    不重映射会导致 KMI CRC 大面积出错；对老版本内核只是多改了点 debug info，无副作用。
          COMMON_REAL_PATH=$(pwd -P)
          ROOT_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          KCFLAGS+=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."
          # 2. Rust 工具链声明（不声明的话 scripts/rust_is_available.sh 会判定失败）
          if [ "${{ env.NEED_RUST }}" = "true" ]; then
            export RUSTC="rustc"
            export BINDGEN="bindgen"
            export LIBCLANG_PATH="$WORKDIR/kernel_workspace/clang-tc/lib"
          fi
          export CC="clang"
          # 3. 其他公共 KCFLAGS
          KCFLAGS+=" -no-canonical-prefixes"
          KCFLAGS+=" -O2"
          KCFLAGS+=" -pipe"
          KCFLAGS+=" -Wno-error"
          KCFLAGS+=" -fno-stack-protector"
          KCFLAGS+=" -D__ANDROID_COMMON_KERNEL__"
          export KCFLAGS
          # 4. 工具链环境
          export HOSTCC=clang
          export LD="ld.lld"
          export HOSTLD=ld.lld
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export AR=llvm-ar NM=llvm-nm AS=clang READELF=llvm-readelf
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump OBJSIZE=llvm-size STRIP=llvm-strip
          # 5. 官方环境脚本
          source "./_setup_env.sh" 2>/dev/null || true

          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out gki_defconfig &&
          export CC="$(pwd)/cc-wrapper" && export LD="$(pwd)/ld-wrapper" &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" OBJCOPY="llvm-objcopy" O=out Image

          echo "--- 编译后环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "内核编译完成！"

          # 构建后确认真实 release 字符串
          REL=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' out/include/generated/utsrelease.h)
          echo "内核 release: $REL"
          echo "KERNEL_REL=$REL" >> $GITHUB_ENV
          echo "kernel_rel=$REL" >> $GITHUB_OUTPUT
          if [ -n "${EXPECT_VERMAGIC:-}" ] && [[ "$REL" != *"$EXPECT_VERMAGIC"* ]]; then
            echo "::warning::实际 release($REL) 不含期望版本串($EXPECT_VERMAGIC)，厂商模块很可能加载失败"
          fi
          echo "expect vermagic: ${EXPECT_VERMAGIC:-未指定}"

          if [ "${{ inputs.ccache_debug }}" == "true" ]; then
            cd ..
            cp ./common/out/vmlinux.symvers ./vmlinux.symvers || true
            cp ./common/out/.config ./config || true
            zip -r9 debug.zip ccache.log config vmlinux.symvers || true
          fi
          echo "ccache状态："
          ccache -s
          df -h

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 应用KPM并修补内核
        if: inputs.kpm_enable
        run: |
          echo "::warning::已开启 KPM。6.6.118 实测可开机；6.12 系列 KPatch-Next 适配尚不完整，打补丁失败会自动回退到未打补丁的 Image，脚本不会中止，但刷机风险自负"
          cd kernel_workspace/common/out/arch/arm64/boot
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          chmod +x ./kptools-linux
          if ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage; then
            rm -f Image
            mv oImage Image
            echo "KPM_STATUS=patched" >> $GITHUB_ENV
            echo "KPM 已并入 Image"
          else
            rm -f oImage
            echo "::warning::kptools 打补丁失败（该内核版本 KPatch-Next 可能未适配），继续使用未打补丁的 Image"
            echo "KPM_STATUS=failed" >> $GITHUB_ENV
          fi
          ls -l ./Image

      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          cd kernel_workspace
          git clone "${{ inputs.ak3_repo }}" --depth=1 AnyKernel3
          if [ ! -f ./AnyKernel3/anykernel.sh ]; then
            echo "::error::${{ inputs.ak3_repo }} 里没有 anykernel.sh，不是合法的 AnyKernel3 仓库"
            exit 1
          fi
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "未找到内核镜像文件，构建可能出错"
            exit 1
          fi

          if [[ ${{ inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ ${{ inputs.ksu_type }} == "bakasu" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ ${{ inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ ${{ inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi

          if [[ "${{ inputs.lz4kd_enable }}" == "true" ]]; then
            wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip
          fi
          if [[ "${{ inputs.kpm_enable }}" == "true" ]]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi

          # 文件名用构建出的真实 release，避免子版本号猜错
          RELEASE_SAFE=$(echo "${KERNEL_REL:-unknown}" | tr '/ :' '___')
          PARTS="AnyKernel3_${KSU_TYPENAME}"
          if [ -n "${KSUVER}" ]; then PARTS="${PARTS}_${KSUVER}"; fi
          PARTS="${PARTS}_${RELEASE_SAFE}"
          if [ -n "${{ inputs.kernel_suffix }}" ]; then PARTS="${PARTS}_${{ inputs.kernel_suffix }}"; fi
          AK3_NAME="${PARTS}.zip"
          zip -r "../$AK3_NAME" ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT
          echo "打包完成：$AK3_NAME"

          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Target: ${{ inputs.gki_target }}" >> ./ak3.log
          echo "Source: ${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_BRANCH }}" >> ./ak3.log
          echo "Kernel Rel: ${KERNEL_REL}" >> ./ak3.log
          echo "Expect Vermagic: ${EXPECT_VERMAGIC:-未指定}" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${KSUVER}" >> ./ak3.log
          echo "susfs: ${{ inputs.susfs_enable }}" >> ./ak3.log
          echo "KPM: ${{ inputs.kpm_enable }} / ${KPM_STATUS:-off}" >> ./ak3.log
          echo "UnicodeFix: ${{ inputs.unicode_fix }} / ${UNICODE_FIX_STATUS:-off}" >> ./ak3.log
          echo "BBG: ${{ inputs.baseband_guard }} / ${BBG_STATUS:-off}" >> ./ak3.log
          echo "MapsHide: ${{ inputs.vp_hide }} / ${{ env.VP_PATCH }}" >> ./ak3.log
          echo "LZ4: ${{ inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ inputs.lz4kd_enable }}" >> ./ak3.log
          echo "IPset: ${{ inputs.better_net }}" >> ./ak3.log
          echo "BBR&Brutal: ${{ inputs.bbr_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ inputs.droidspaces_enable }}" >> ./ak3.log
          echo "ADIOS: ${{ inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ inputs.rekernel_enable }}" >> ./ak3.log
          zip -z "../$AK3_NAME" < ./ak3.log

      - name: 上传 Ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/debug.zip
          archive: false

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

      - name: 构建结果摘要
        if: always()
        run: |
          echo "### 构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 档位：\`${{ inputs.gki_target }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 源码：\`${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_BRANCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 内核 release：\`${KERNEL_REL:-构建失败或未产出}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 期望 vermagic：\`${EXPECT_VERMAGIC:-未指定}\`" >> $GITHUB_STEP_SUMMARY
          echo "- KPM：\`${{ inputs.kpm_enable }} / ${KPM_STATUS:-off}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 零宽修复：\`${{ inputs.unicode_fix }} / ${UNICODE_FIX_STATUS:-off}\`" >> $GITHUB_STEP_SUMMARY
          echo "- BBG：\`${{ inputs.baseband_guard }} / ${BBG_STATUS:-off}\`" >> $GITHUB_STEP_SUMMARY
          echo "- maps 隐藏：\`${{ inputs.vp_hide }} / ${{ env.VP_PATCH }}\`" >> $GITHUB_STEP_SUMMARY

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      KERNEL_VERSION: ${{ needs.setup.outputs.kernel_version }}
      ANDROID_VERSION: ${{ needs.setup.outputs.android_version }}

    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: 设置环境变量
        run: |
          echo "FULL_VERSION=${{ needs.build.outputs.kernel_rel }}" >> $GITHUB_ENV
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          echo "TAG_HEAD=GKI-build" >> $GITHUB_ENV
          if [[ ${{ inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ ${{ inputs.ksu_type }} == "bakasu" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ ${{ inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ ${{ inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="无内置KSU"
          fi
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV
          VERMAGIC="${{ inputs.kernel_vermagic }}"
          [ -n "$VERMAGIC" ] || VERMAGIC="${{ needs.setup.outputs.default_vermagic }}"
          echo "EFFECTIVE_VERMAGIC=${VERMAGIC:-未指定}" >> $GITHUB_ENV

      - name: 创建发布
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 通用 GKI 内核 | 构建信息
          - 版本档位: `${{ inputs.gki_target }}`
          - 源码: `${{ needs.setup.outputs.source_repo }} @ ${{ needs.setup.outputs.source_branch }}`
          - 内核 release: `${{ needs.build.outputs.kernel_rel }}`
          - 期望 vermagic: `${{ env.EFFECTIVE_VERMAGIC }}`
          - 编译时间: ${{ env.TIME_FORM }}
          - KSU分支：${{ env.KSU_TYPENAME }}
          - susfs支持：${{ inputs.susfs_enable }}
          - KPM支持：${{ inputs.kpm_enable }}（实际是否并入见包内 ak3.log 的 `KPM:` 行）
          - 零宽字符修复：${{ inputs.unicode_fix }}
          - LZ4支持：${{ inputs.lz4_enable }}
          - LZ4KD支持：${{ inputs.lz4kd_enable }}
          - 网络功能增强：${{ inputs.better_net }}
          - BBR/Brutal 等拥塞控制算法支持：${{ inputs.bbr_enable }}
          - Droidspaces 容器支持：${{ inputs.droidspaces_enable }}
          - ADIOS IO调度器支持：${{ inputs.adios_enable }}
          - Re-Kernel支持：${{ inputs.rekernel_enable }}
          - 内核级基带保护支持：${{ inputs.baseband_guard }}
          - maps 隐藏：${{ inputs.vp_hide }}（${{ needs.setup.outputs.vp_patch }}）

          ### 📋 安装方法 | Installation Guide
          1. 已有第三方 Recovery（如 TWRP）时，可直接刷入本 AnyKernel3 包后重启；
          2. 已有 root 时，可用 [HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases) 刷入；
          3. 已刷入 SukiSU Ultra 内核且管理器为最新版时，可直接在管理器中刷入；
          4. 刷入无 lz4kd 补丁版前，若之前用过 lz4kd 版，请先关闭 zram 模块；
          5. 新版 KSU 管理器需要配合元模块（meta-overlayfs / mountify / meta-magic_mount 等）才能正常挂载模块；
          6. KernelPatch Next（KPN）独立于 KSU，可与面具共存，但不能与内置 kpm 的内核共用。

          #### ⚠️ 本包只替换 boot 分区的 kernel，未改动 vendor_boot / dtbo / vbmeta。
          #### 若开机卡住，先确认 vermagic 与设备原厂 `uname -r` 是否一致，再回刷原厂 boot。
          #### ※※※刷写内核有风险，刷入前请务必用 KernelFlasher 备份 boot 等关键分区※※※
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
